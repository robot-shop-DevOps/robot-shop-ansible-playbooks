name: Validate and Run Ansible playbooks

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        required: true
        type: choice
        options:
          - dev
          - prod

      ANSIBLE_COMMAND:
        required: true
        description: "Dry run or Apply ansible playbooks"
        type: choice
        options:
          - dry_run
          - run

      ANSIBLE_EXTRA_ARGS:
        required: false
        type: string
        default: ""

      ANSIBLE_VARS_FILE:
        required: false
        type: string
        default: ""

      PLAYBOOK:
        required: true
        description: "Which playbook to run"
        type: choice
        options:
          - elasticsearch
          - kibana
          - grafana
          - openresty
          - certbot
          - certificate_renewal

jobs:
  deploy:
    uses: robot-shop-DevOps/robot-shop-github-actions/.github/workflows/ansible-playbooks.yaml@main
    with:
      ENVIRONMENT: ${{ github.event.inputs.ENVIRONMENT }}
      ANSIBLE_COMMAND: ${{ github.event.inputs.ANSIBLE_COMMAND }}
      PLAYBOOK: ${{ github.event.inputs.PLAYBOOK }}
      ANSIBLE_EXTRA_ARGS: ${{ github.event.inputs.ANSIBLE_EXTRA_ARGS }}
      ANSIBLE_VARS_FILE: ${{ github.event.inputs.ANSIBLE_VARS_FILE }}
    secrets: inherit